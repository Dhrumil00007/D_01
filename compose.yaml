services:
  app:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "127.0.0.1:8000:8000"
    image: patient-fastapi-app:latest
    environment:
      DB_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
